services:
  postgres:
    image: postgres:15.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudguard}
      POSTGRES_USER: ${POSTGRES_USER:-cloudguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cloudguard:change-me-for-local-development@postgres:5432/cloudguard}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-deployment}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - ${AWS_CONFIG_DIR:-./.aws}:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cloudguard:change-me-for-local-development@postgres:5432/cloudguard}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-deployment}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./apps/api:/app
      - ${AWS_CONFIG_DIR:-./.aws}:/root/.aws:ro
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
